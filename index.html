<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGCompus Past Papers - DTME</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}
h1{background:#0d47a1;color:white;padding:15px;border-radius:10px;text-align:center}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px #ccc}
a.paper{display:block;background:#0d47a1;color:white;padding:12px;text-align:center;border-radius:8px;text-decoration:none;margin-top:10px;font-weight:bold}
#viewer{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:9999}
#viewer iframe{width:100%;height:100%;border:none}
.topbar{background:#111;color:white;padding:10px;display:flex;justify-content:space-between}
.topbar button{background:#ff3d00;color:white;border:none;padding:8px 15px;border-radius:5px}
</style>
</head>
<body>
<h1>📚 UGCompus Past Papers<br>Makerere DTME 2.1</h1>

<div class="card">
<h3>DTME 211 - Thermodynamics</h3>
<p>Year 2 Semester 1 - 2023/2024</p>
<a class="paper" href="#" onclick="openPaper('1T7d5yF8_example_id')">📄 View Paper Inside App</a>
</div>

<div class="card">
<h3>DTME 212 - Fluid Mechanics</h3>
<p>Year 2 Semester 1 - 2023/2024</p>
<a class="paper" href="#" onclick="openPaper('1T7d5yF8_example_id')">📄 View Paper Inside App</a>
</div>

<div id="viewer">
<div class="topbar">
<button onclick="closePaper()">✕ Close</button>
<button onclick="downloadPaper()">⬇️ Download</button>
</div>
<iframe id="frame"></iframe>
</div>

<script>
let currentId='';
function openPaper(id){
currentId=id;
document.getElementById('frame').src='https://drive.google.com/file/d/'+id+'/preview';
document.getElementById('viewer').style.display='block';
}
function closePaper(){
document.getElementById('viewer').style.display='none';
document.getElementById('frame').src='';
}
function downloadPaper(){
window.open('https://drive.google.com/uc?export=download&id='+currentId,'_blank');
}
</script>
</body>
</html>
