<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - UGCompus</title>
<style>
body{font-family:Arial;background:#f0f4f8;padding:20px;max-width:600px;margin:auto}
#login{background:#fff;padding:20px;border-radius:12px;margin-top:50px;text-align:center}
#main{display:none}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd}
button{background:#0f172a;color:#fff;font-weight:bold;cursor:pointer}
.card{background:#fff;padding:12px;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.del{background:#fee2e2;color:#dc2626;border:none;padding:8px 12px;border-radius:6px;width:auto}
</style>
</head>
<body>

<div id="login">
<h2>🔐 Owner Login</h2>
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="check()">LOGIN</button>
<p id="err" style="color:red"></p>
</div>

<div id="main">
<h2>Admin - Add / Delete Papers</h2>
<input id="t" placeholder="Title e.g DTME 211 Thermodynamics">
<input id="y" placeholder="Year e.g Y2 S1">
<input id="l" placeholder="Google Drive Link">
<button onclick="add()">➕ ADD PAPER</button>
<hr>
<h3>Your Papers</h3>
<div id="list"></div>
</div>

<script>
const PASSWORD="Simon@pics";
function check(){
 let p=document.getElementById('pass').value;
 if(p===PASSWORD){
  document.getElementById('login').style.display='none';
  document.getElementById('main').style.display='block';
  show();
 } else {
  document.getElementById('err').innerText='Wrong Password Boss!';
 }
}

let papers=JSON.parse(localStorage.getItem('ug_papers')||'[]');
function add(){
 let title=document.getElementById('t').value;
 let year=document.getElementById('y').value;
 let link=document.getElementById('l').value;
 if(!title||!link){alert('Add Title & Link!');return}
 papers.push({t:title,y:year,l:link});
 localStorage.setItem('ug_papers',JSON.stringify(papers));
 document.getElementById('t').value='';document.getElementById('l').value='';
 show();
}
function del(i){
 if(confirm('Delete '+papers[i].t+'?')){
  papers.splice(i,1);
  localStorage.setItem('ug_papers',JSON.stringify(papers));
  show();
 }
}
function show(){
 let div=document.getElementById('list');
 if(papers.length==0){div.innerHTML='<p>No papers yet</p>';return}
 div.innerHTML=papers.map((p,i)=>`<div class="card"><div><b>${p.t}</b><br><small>${p.y}</small></div><button class="del" onclick="del(${i})">🗑️</button></div>`).join('');
}
</script>
</body>
</html>
