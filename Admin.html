<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Panel</title>
<style>body{background:#0f172a;color:#fff;font-family:Arial;padding:20px}#box{max-width:500px;margin:auto;background:#1e293b;padding:20px;border-radius:12px}input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none}button{background:#22c55e;color:#fff;font-weight:bold;cursor:pointer}.card{background:#334155;padding:10px;border-radius:8px;margin-top:10px;display:flex;justify-content:space-between}</style>
</head><body>
<div id="box">
<h2>👑 OWNER PANEL - UGCompus</h2>
<p style="font-size:12px;color:#94a3b8">Only you can access this</p>
<input id="pass" type="password" placeholder="Enter Owner Password">
<button onclick="login()">LOGIN AS OWNER</button>

<div id="panel" style="display:none">
<h3 style="margin-top:20px">➕ Add New Paper</h3>
<input id="t" placeholder="Paper Title e.g DTME 214"><input id="y" placeholder="Year e.g Y2 S1"><input id="l" placeholder="Google Drive Link">
<button onclick="add()">ADD PAPER</button>
<h3 style="margin-top:20px">📊 Stats</h3>
<p>Total Downloads: <span id="dl">0</span></p>
<p>Total Papers: <span id="tp">0</span></p>
<p>Ad Zone: 11684235 (nap5k.com) - Video Ad Active</p>
<h3>📚 All Papers (You can delete)</h3>
<div id="list"></div>
</div>
</div>
<script>
let OWNER_PASS="simon@pics"; // YOUR OWNER PASSWORD - Change it!
function login(){if(document.getElementById('pass').value==OWNER_PASS){document.getElementById('panel').style.display='block';load();}else alert('Wrong Password Boss!');}
let papers=JSON.parse(localStorage.getItem('ug')||'[]');
function load(){
 document.getElementById('tp').innerText=papers.length;
 document.getElementById('dl').innerText=localStorage.getItem('dlCount')||0;
 let h="";papers.forEach((p,i)=>{h+=`<div class="card"><span>${p.t}</span><button onclick="del(${i})" style="width:auto;background:red;padding:5px 10px">Delete</button></div>`});
 document.getElementById('list').innerHTML=h;
}
function add(){
 let t=document.getElementById('t').value,y=document.getElementById('y').value,l=document.getElementById('l').value;
 if(!t||!l)return alert('Add Title & Link');
 papers.push({t,y,l}); localStorage.setItem('ug',JSON.stringify(papers)); load(); alert('Paper Added Boss!');
}
function del(i){if(confirm('Delete?')){papers.splice(i,1);localStorage.setItem('ug',JSON.stringify(papers));load();}}
</script>
</body></html>
