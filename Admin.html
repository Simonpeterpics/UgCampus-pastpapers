<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UgCampus PastPapers</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');body{font-family:'Outfit',sans-serif;background:#e8f5e9;min-height:100vh}.glass{background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.7)}.active-menu{background:#15803d;color:white!important;border-radius:14px}</style></head><body class="p-3 md:p-4">
<nav class="glass rounded-[20px] px-5 py-3 flex justify-between items-center max-w-7xl mx-auto"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-green-700 rounded-full flex items-center justify-center text-white font-bold">UG</div><div><h1 class="font-bold text-green-900 leading-none">UgCampus</h1><p class="text-xs text-gray-500 font-bold tracking-widest">PastPapers</p></div></div><div class="flex items-center gap-2 ml-auto"><span id="userName" class="hidden font-bold text-[11px] text-green-900 max-w-[120px] truncate"></span><button id="logoutBtn" onclick="logout()" class="hidden bg-white border px-3 py-2 rounded-full text-[11px]">Logout</button><button onclick="openAdmin()" class="bg-black text-white text-[11px] px-5 py-2.5 rounded-full font-bold flex items-center gap-1.5"><i class="fa-solid fa-user-shield text-[10px]"></i> Admin</button></div></nav>
<div class="max-w-7xl mx-auto grid lg:grid-cols-[280px_1fr] gap-4 mt-4"><div class="glass rounded-[24px] p-4 h-fit"><button onclick="setTab('dashboard')" id="m-dashboard" class="active-menu w-full text-left p-3 flex gap-3 items-center font-semibold text-sm"><i class="fa fa-border-all"></i> Dashboard</button><button onclick="setTab('papers')" id="m-papers" class="w-full text-left p-3 flex gap-3 items-center text-sm text-gray-700"><i class="fa fa-file"></i> Past Papers</button><button onclick="setTab('favorites')" id="m-favorites" class="w-full text-left p-3 flex gap-3 items-center text-sm text-gray-700"><i class="fa fa-heart"></i> Favorites</button><button onclick="setTab('notes')" id="m-notes" class="w-full text-left p-3 flex gap-3 items-center text-sm text-gray-700"><i class="fa fa-book"></i> Notes</button><button onclick="setTab('analytics')" id="m-analytics" class="w-full text-left p-3 flex gap-3 items-center text-sm text-gray-700"><i class="fa fa-chart-simple"></i> Analytics</button></div><div class="space-y-4"><div class="glass rounded-[24px] p-6 md:p-8"><h2 class="text-[26px] font-bold text-green-950">Welcome back, <span id="welcomeName">Student</span>!</h2><p class="text-sm text-green-700/70 mt-1">Search past papers below.</p><div class="mt-5 bg-white rounded-full p-2 flex shadow-sm"><input id="search" oninput="render()" placeholder="Search BCOM, BIT, Law..." class="flex-1 px-6 outline-none bg-transparent text-sm"><button class="bg-green-700 text-white px-8 py-3 rounded-full font-bold text-sm">Search</button></div></div><div id="papersGrid" class="grid gap-3"></div><div id="emptyState" class="hidden glass rounded-[24px] p-12 text-center"><p class="text-4xl mb-3">📄</p><h3 class="font-bold">No Papers Yet</h3><p class="text-sm text-gray-500">Click Admin to add first paper</p></div><div id="notesState" class="hidden glass rounded-[24px] p-8"><h3 class="font-bold text-lg">Revision Notes</h3><textarea id="noteInput" placeholder="Write note..." class="w-full mt-4 border rounded-2xl p-4 text-sm outline-none"></textarea><button onclick="saveNote()" class="mt-3 bg-green-700 text-white px-6 py-2 rounded-full text-sm font-bold">Save Note</button><div id="notesList" class="mt-4 space-y-2"></div></div></div></div>
<div id="userModal" class="flex fixed inset-0 bg-[#e8f5e9]/95 backdrop-blur-md z-[200] flex items-center justify-center p-4"><div class="bg-white rounded-[24px] p-7 w-full max-w-sm shadow-2xl border"><h3 class="font-bold text-lg text-green-900">UgCampus Login</h3><input id="uName" placeholder="Full Name" class="w-full border rounded-full px-5 py-3 mt-4 mb-3 outline-none text-sm"><select id="uUni" class="w-full border rounded-full px-5 py-3 mb-3 outline-none text-sm bg-white"><option value="">Select University</option><option>Makerere</option><option>MUBS</option><option>Kyambogo</option><option>KIU</option><option>Other</option></select><select id="uCourse" class="w-full border rounded-full px-5 py-3 mb-4 outline-none text-sm bg-white"><option value="">Select Course</option><option>BCOM</option><option>BIT</option><option>BBA</option><option>LAW</option><option>Other</option></select><button onclick="userLogin()" class="w-full bg-green-700 text-white py-3 rounded-full font-bold text-sm">Access PastPapers</button></div></div>
<div id="adminModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[300] flex items-center justify-center p-4"><div class="bg-white rounded-[24px] p-6 w-full max-w-lg max-h-[90vh] overflow-auto shadow-2xl"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🔒 Admin</h3><button onclick="closeAdmin()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div>
<div id="adminLoginBox"><div class="relative"><input id="adminPass" type="password" placeholder="Enter password" class="w-full border rounded-full px-5 py-3 pr-12 outline-none text-sm"><button onclick="toggleAdminPass()" class="absolute right-2 top-1.5 w-9 h-9 bg-gray-100 rounded-full"><i id="adminEye" class="fa-solid fa-eye text-xs"></i></button></div><button onclick="adminLogin()" id="adminLoginBtn" class="w-full mt-3 bg-black text-white py-3 rounded-full font-bold text-sm">Unlock</button><p id="adminErr" class="text-xs text-red-500 mt-2 text-center"></p></div>
<div id="adminFormBox" class="hidden"><input id="title" placeholder="Paper Title" class="w-full border rounded-full px-4 py-3 mb-3 text-sm outline-none"><input id="subject" placeholder="Subject" class="w-full border rounded-full px-4 py-3 mb-3 text-sm outline-none"><input id="year" placeholder="Year e.g 2026" class="w-full border rounded-full px-4 py-3 mb-3 text-sm outline-none"><input id="uni" placeholder="University e.g KIU" class="w-full border rounded-full px-4 py-3 mb-3 text-sm outline-none"><input id="course" placeholder="Course e.g BTM" class="w-full border rounded-full px-4 py-3 mb-3 text-sm outline-none"><input id="link" placeholder="Google Drive Link" class="w-full border rounded-full px-4 py-3 mb-3 text-sm outline-none"><button onclick="savePaper()" id="btn" class="w-full bg-green-700 text-white py-3 rounded-full font-bold text-sm">Save to Database</button><p id="status" class="text-sm mt-3 text-center"></p><div id="list" class="mt-4"></div></div>
</div></div>
<script>
let currentTab='dashboard';let currentUser=JSON.parse(localStorage.getItem('edu_user'))||null;let papers=[];let myNotes=JSON.parse(localStorage.getItem('my_notes'))||[];let adminUnlocked=localStorage.getItem('admin_token')?true:false;
async function loadPapersFromDB(){try{let r=await fetch('/api/papers');papers=await r.json();render();}catch(e){}}loadPapersFromDB();
function openAdmin(){document.getElementById('adminModal').classList.remove('hidden');document.getElementById('adminModal').classList.add('flex');if(adminUnlocked){showAdminForm();loadList();}}
function closeAdmin(){document.getElementById('adminModal').classList.add('hidden');}
function toggleAdminPass(){let i=document.getElementById('adminPass');let eye=document.getElementById('adminEye');if(i.type==='password'){i.type='text';eye.className='fa-solid fa-eye-slash text-xs'}else{i.type='password';eye.className='fa-solid fa-eye text-xs'}}
async function adminLogin(){let p=document.getElementById('adminPass').value;if(!p)return;document.getElementById('adminLoginBtn').textContent='Checking...';let res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(res.ok){localStorage.setItem('admin_token',p);adminUnlocked=true;showAdminForm();loadList();}else{document.getElementById('adminErr').textContent='❌ Wrong password!';document.getElementById('adminLoginBtn').textContent='Unlock';}}
function showAdminForm(){document.getElementById('adminLoginBox').classList.add('hidden');document.getElementById('adminFormBox').classList.remove('hidden');}
function setTab(tab){currentTab=tab;document.querySelectorAll('[id^="m-"]').forEach(e=>e.classList.remove('active-menu'));document.getElementById('m-'+tab).classList.add('active-menu');render();}
function checkUser(){if(!currentUser){document.getElementById('userModal').classList.remove('hidden');return;}document.getElementById('userName').textContent=currentUser.name;document.getElementById('userName').classList.remove('hidden');document.getElementById('welcomeName').textContent=currentUser.name;document.getElementById('logoutBtn').classList.remove('hidden');document.getElementById('userModal').classList.add('hidden');}
checkUser();
function userLogin(){let n=document.getElementById('uName').value.trim();let uni=document.getElementById('uUni').value;let course=document.getElementById('uCourse').value;if(!n||!uni||!course)return alert('Fill all');currentUser={name:n,uni:uni,course:course};localStorage.setItem('edu_user',JSON.stringify(currentUser));checkUser();render();}
function logout(){localStorage.removeItem('edu_user');location.reload();}
function render(){let q=document.getElementById('search').value.toLowerCase();let grid=document.getElementById('papersGrid');let empty=document.getElementById('emptyState');let notesBox=document.getElementById('notesState');if(currentTab==='notes'){grid.classList.add('hidden');empty.classList.add('hidden');notesBox.classList.remove('hidden');document.getElementById('notesList').innerHTML=myNotes.map(n=>`<div class="bg-white rounded-xl p-3 text-sm border">${n}</div>`).join('')||'<p class="text-xs text-gray-400">No notes</p>';return;}notesBox.classList.add('hidden');let filtered=[...papers];if(currentTab==='favorites'){filtered=filtered.filter(p=>p.likedBy.includes(currentUser?.name));}if(q){filtered=filtered.filter(p=>p.title.toLowerCase().includes(q)||p.subject.toLowerCase().includes(q));}if(papers.length===0){grid.classList.add('hidden');empty.classList.remove('hidden');return;}if(filtered.length===0){grid.classList.remove('hidden');empty.classList.add('hidden');grid.innerHTML=`<div class="glass rounded-2xl p-12 text-center text-sm text-gray-500">No papers found</div>`;return;}empty.classList.add('hidden');grid.classList.remove('hidden');grid.innerHTML=filtered.map(p=>{let liked=currentUser&&p.likedBy.includes(currentUser.name);return `<div class="glass rounded-[20px] p-4"><div class="flex justify-between mb-2"><span class="bg-green-100 text-green-800 text-[10px] px-3 py-1 rounded-full font-bold uppercase">${p.subject} • ${p.year}</span><span class="text-[11px] text-gray-500">${p.downloads} downloads</span></div><h3 class="font-bold text-[15px]">${p.title}</h3><p class="text-xs text-gray-500 mt-1">${p.uni} • ${p.course}</p><div class="flex gap-2 mt-4"><button onclick="window.open('${p.link}','_blank')" class="flex-1 bg-green-700 text-white py-3 rounded-full font-bold text-sm">Open</button><button onclick="doDownload(${p.id})" class="w-12 h-12 bg-white border rounded-full flex items-center justify-center"><i class="fa-solid fa-download text-green-700"></i></button></div><div class="flex gap-4 mt-3 border-t pt-3"><button onclick="likePaper(${p.id})" class="text-xs flex items-center gap-1 ${liked?'text-red-500':'text-gray-600'}"><i class="fa-${liked?'solid':'regular'} fa-heart"></i> ${p.likes}</button></div></div>`;}).join('');}
function getDirectLink(link){if(link.includes('drive.google.com')){let m=link.match(/\/d\/([a-zA-Z0-9_-]+)/)||link.match(/id=([a-zA-Z0-9_-]+)/);if(m)return 'https://drive.google.com/uc?export=download&id='+m[1];}return link;}
function doDownload(id){let p=papers.find(x=>x.id===id);let direct=getDirectLink(p.link);p.downloads++;render();let a=document.createElement('a');a.href=direct;a.download='';document.body.appendChild(a);a.click();a.remove();}
function likePaper(id){let p=papers.find(x=>x.id===id);if(p.likedBy.includes(currentUser.name)){p.likedBy=p.likedBy.filter(n=>n!==currentUser.name);p.likes--;}else{p.likedBy.push(currentUser.name);p.likes++;}render();}
async function loadList(){let r=await fetch('/api/papers');let d=await r.json();if(Array.isArray(d))document.getElementById('list').innerHTML=d.map(p=>`<div class="border-b py-2 text-sm flex justify-between">${p.title}<button onclick="del(${p.id})" class="text-red-500">Delete</button></div>`).join('')}
async function savePaper(){let token=localStorage.getItem('admin_token');let body={title:title.value,subject:subject.value,year:year.value,uni:uni.value,course:course.value,link:link.value};let res=await fetch('/api/papers',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':token},body:JSON.stringify(body)});let txt=await res.text();document.getElementById('status').textContent=res.ok?'✅ Saved!':'❌ '+txt;if(res.ok){loadPapersFromDB();loadList();}}
async function del(id){let t=localStorage.getItem('admin_token');await fetch('/api/papers?id='+id,{method:'DELETE',headers:{'x-admin-password':t}});loadPapersFromDB();loadList();}
function saveNote(){let t=document.getElementById('noteInput').value.trim();if(!t)return;myNotes.push(t);localStorage.setItem('my_notes',JSON.stringify(myNotes));document.getElementById('noteInput').value='';render();}
</script>
</body>
</html>
