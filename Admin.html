<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - UgCampus</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-green-50 p-6">
<div class="max-w-xl mx-auto bg-white rounded-2xl p-6 shadow">
<h1 class="font-bold text-xl mb-4">UgCampus Admin - Add Paper</h1>
<input id="title" placeholder="Paper Title e.g BCOM Year 2 Accounting" class="w-full border rounded-full px-4 py-3 mb-3">
<input id="subject" placeholder="Subject e.g Accounting" class="w-full border rounded-full px-4 py-3 mb-3">
<input id="year" placeholder="Year e.g 2023" class="w-full border rounded-full px-4 py-3 mb-3">
<input id="uni" placeholder="University e.g Makerere" class="w-full border rounded-full px-4 py-3 mb-3">
<input id="course" placeholder="Course e.g BCOM" class="w-full border rounded-full px-4 py-3 mb-3">
<input id="link" placeholder="Google Drive Link" class="w-full border rounded-full px-4 py-3 mb-3">
<button onclick="savePaper()" id="btn" class="w-full bg-green-700 text-white py-3 rounded-full font-bold">Save to Database</button>
<p id="status" class="text-sm mt-3 text-center"></p>
<a href="/" class="block text-center mt-4 text-sm underline">Go to Home</a>
<div id="list" class="mt-6"></div>
</div>
<script>
async function load(){let r=await fetch('/api/papers');let data=await r.json();document.getElementById('list').innerHTML=data.map(p=>`<div class="border-b py-2 text-sm">${p.title} - ${p.uni}</div>`).join('')}
load();
async function savePaper(){
 let btn=document.getElementById('btn');btn.textContent='Saving...';
 let body={title:document.getElementById('title').value,subject:document.getElementById('subject').value,year:document.getElementById('year').value,uni:document.getElementById('uni').value,course:document.getElementById('course').value,link:document.getElementById('link').value}
 let res=await fetch('/api/papers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(res.ok){document.getElementById('status').textContent='✅ Saved!';load();}else{document.getElementById('status').textContent='❌ Failed';}
 btn.textContent='Save to Database';
}
</script>
</body>
</html>
