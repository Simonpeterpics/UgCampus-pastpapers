<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title>
<style>body{background:#0f172a;color:#fff;font-family:Arial;padding:15px}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;box-sizing:border-box}button{padding:12px;background:#22c55e;border:none;border-radius:8px;color:#fff;font-weight:bold;width:100%;margin-top:8px}.card{background:#1e293b;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center}</style>
</head><body>
<div id="a" style="max-width:500px;margin:80px auto;background:#1e293b;padding:25px;border-radius:15px;text-align:center"><h2>UGCAMPUS OWNER</h2><input type="password" id="p" placeholder="Password"><button onclick="if(document.getElementById('p').value=='simon@pics'){document.getElementById('a').style.display='none';document.getElementById('b').style.display='block';load()}else{alert('Wrong! Use kampala123')}">LOGIN</button></div>
<div id="b" style="display:none;max-width:600px;margin:auto"><h2>📚 Add Paper</h2><input id="c" placeholder="Course e.g CSC1101"><input id="t" placeholder="Name e.g Intro to CS"><select id="y"><option>2024</option><option>2023</option><option>2022</option><option>2021</option></select><input id="l" placeholder="Google Drive PDF Link - VERY IMPORTANT"><button onclick="add()">ADD PAPER NOW</button><h3>Papers: <span id="n">0</span></h3><div id="list"></div></div>
<script>
let data=JSON.parse(localStorage.getItem('ug')||'[]');
function load(){let h='';data.forEach((x,i)=>{h+=`<div class=card><div><b>${x.c}</b><br>${x.t} ${x.y}</div><button style=background:#ef4444;width:auto onclick=del(${i})>X</button></div>`});document.getElementById('list').innerHTML=h;document.getElementById('n').innerText=data.length}
function add(){let c=document.getElementById('c').value,t=document.getElementById('t').value,y=document.getElementById('y').value,l=document.getElementById('l').value;if(!c||!t||!l)return alert('Fill all!');data.push({c,t,y,l});localStorage.setItem('ug',JSON.stringify(data));load();document.getElementById('c').value='';document.getElementById('t').value='';document.getElementById('l').value='';alert('Added! Now students will see it on your phone. For ALL phones, screenshot this and send me I will make permanent.')}
function del(i){data.splice(i,1);localStorage.setItem('ug',JSON.stringify(data));load()}
</script></body></html>
