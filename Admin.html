<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UgCampus Admin</title>
<style>
body{font-family:sans-serif;padding:15px;background:#f5f5f5}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 5px #0001}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd}
button{background:#16a34a;color:white;font-weight:bold;border:none}
button.del{background:#ef4444}
h2{color:#16a34a}
</style>
</head>
<body>
<h2>🇺🇬 UgCampus Admin Panel</h2>
<div class="card">
<h3>Add New Past Paper</h3>
<select id="uni">
<option>Makerere University</option>
<option>Kyambogo University</option>
<option>MUBS</option>
<option>KIU</option>
<option>UCU</option>
<option>Gulu University</option>
<option>Busitema</option>
<option>Other</option>
</select>
<input id="course" placeholder="Course e.g. B.Com Year 2">
<input id="subject" placeholder="Subject e.g. Accounting">
<input id="year" placeholder="Year e.g. 2023">
<input id="link" placeholder="Google Drive PDF Link">
<select id="price">
<option value="0">FREE</option>
<option value="5000">5000 UGX - Paid</option>
</select>
<button onclick="addPaper()">➕ Add Paper</button>
</div>

<div class="card">
<h3>All Papers (<span id="count">0</span>)</h3>
<div id="list"></div>
</div>

<script>
let papers = JSON.parse(localStorage.getItem('ug_papers')||'[]');
function save(){localStorage.setItem('ug_papers',JSON.stringify(papers)); render();}
function addPaper(){
 let p={
  id:Date.now(),
  uni:document.getElementById('uni').value,
  course:document.getElementById('course').value,
  subject:document.getElementById('subject').value,
  year:document.getElementById('year').value,
  link:document.getElementById('link').value,
  price:document.getElementById('price').value
 };
 if(!p.course||!p.link){alert('Fill course and link!');return;}
 papers.unshift(p); save();
 document.getElementById('course').value='';document.getElementById('link').value='';
 alert('Added!');
}
function del(id){papers=papers.filter(x=>x.id!=id);save();}
function render(){
 document.getElementById('count').innerText=papers.length;
 document.getElementById('list').innerHTML=papers.map(p=>`
  <div style="border-bottom:1px solid #eee;padding:10px 0">
  <b>${p.subject} - ${p.course}</b><br>
  <small>${p.uni} | ${p.year} | ${p.price==0?'FREE':'5000 UGX'}</small><br>
  <a href="${p.link}" target="_blank">View PDF</a>
  <button class="del" onclick="del(${p.id})">Delete</button>
  </div>
 `).join('')||'No papers yet';
 // also create download json
}
function downloadJSON(){
 let blob=new Blob([JSON.stringify(papers,null,2)],{type:'application/json'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='papers.json';a.click();
}
render();
</script>
<button onclick="downloadJSON()" style="background:#2563eb">⬇️ Download papers.json (Upload to GitHub)</button>
<p><small>After adding papers, tap download then upload papers.json to your GitHub repo. Your app will read it.</small></p>
</body>
</html>
