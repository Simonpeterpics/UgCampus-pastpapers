<!DOCTYPE html>
<html>
<head>
<title>UGCAMPUS ADMIN - Owner Only</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px}
.login{max-width:400px;margin:100px auto;background:#1e293b;padding:30px;border-radius:15px;text-align:center}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
button{background:#22c55e;color:white;padding:12px 20px;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer;margin-top:10px}
.paper{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px;display:flex;justify-content:space-between}
.delete{background:#ef4444;width:auto;padding:5px 15px}
h2{color:#22c55e}
</style>
</head>
<body>

<div id="loginBox" class="login">
<h2>🔒 UGCAMPUS ADMIN</h2>
<p>Owner Only</p>
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="login()">LOGIN</button>
<p id="err" style="color:red"></p>
</div>

<div id="adminBox" style="display:none;max-width:800px;margin:auto">
<h2>📚 Manage Past Papers</h2>

<input id="course" placeholder="Course Code e.g CSC1101">
<input id="title" placeholder="Title e.g Intro to Computer Science">
<select id="year">
<option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option>
</select>
<input id="link" placeholder="PDF Link (Google Drive link)">

<button onclick="addPaper()">+ ADD PAPER</button>

<h3 style="margin-top:30px">All Papers (<span id="count">0</span>)</h3>
<div id="list"></div>

<button style="background:#3b82f6" onclick="saveAndDeploy()">💾 SAVE & UPDATE SITE</button>
<p id="msg"></p>
</div>

<script>
let papers = JSON.parse(localStorage.getItem('ug_papers')||'[]');

function login(){
 if(document.getElementById('pass').value==='ugcampus2024'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminBox').style.display='block';
  show();
 } else {
  document.getElementById('err').innerText='Wrong password! Try simon@pics';
 }
}

function show(){
 let html=''; 
 papers.forEach((p,i)=>{
  html+=`<div class="paper"><div><b>${p.course}</b> - ${p.title} (${p.year})</div><button class="delete" onclick="del(${i})">Delete</button></div>`;
 });
 document.getElementById('list').innerHTML=html;
 document.getElementById('count').innerText=papers.length;
}

function addPaper(){
 let c=document.getElementById('course').value;
 let t=document.getElementById('title').value;
 let y=document.getElementById('year').value;
 let l=document.getElementById('link').value;
 if(!c||!t||!l) return alert('Fill all fields!');
 papers.push({course:c,title:t,year:y,link:l});
 localStorage.setItem('ug_papers',JSON.stringify(papers));
 show();
 document.getElementById('course').value='';document.getElementById('title').value='';document.getElementById('link').value='';
}

function del(i){
 if(confirm('Delete this paper?')){ papers.splice(i,1); localStorage.setItem('ug_papers',JSON.stringify(papers)); show(); }
}

function saveAndDeploy(){
 localStorage.setItem('ug_papers',JSON.stringify(papers));
 document.getElementById('msg').innerText='✅ Saved! Now go to your main site - papers are there! (Saved in browser)';
 alert('Papers saved! But NOTE: This saves on YOUR phone only. For permanent save, copy this code and send to me: '+JSON.stringify(papers).substring(0,100)+'...');
}
</script>
</body>
</html>
