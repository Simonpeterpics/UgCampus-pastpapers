<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Document...</title>
<style>body{background:#0f172a;color:#fff;font-family:Arial;text-align:center;padding:20px}#box{background:#1e293b;padding:25px;border-radius:15px;max-width:400px;margin:30px auto}#timer{font-size:50px;color:#22c55e;font-weight:bold}a.btn{display:block;background:#22c55e;color:#fff;padding:15px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:15px}</style>
</head><body>
<div id="box"><h2>📄 Your Document is Ready</h2><p>Please wait <span id="timer">5</span> seconds... Ads help us keep papers FREE</p>
<!-- PASTE YOUR AD CODE HERE - Adsterra / Monetag -->
<div style="background:#334155;padding:30px;border-radius:10px;margin:15px 0">YOUR AD WILL SHOW HERE<br>Replace this with Adsterra code</div>
<a id="dl" class="btn" href="#">DOWNLOAD NOW</a><p style="font-size:12px;color:#94a3b8">UGCampus PastPapers</p></div>
<script>
let id=new URLSearchParams(location.search).get('id'); let papers=JSON.parse(localStorage.getItem('ug')||'[]'); let link=localStorage.getItem('tempLink')||papers[id]?.l; document.getElementById('dl').href=link;
let c=5; let t=setInterval(()=>{c--; document.getElementById('timer').innerText=c; if(c<=0){clearInterval(t); document.getElementById('timer').innerText='Ready!';}},5000);
// COUNT DOWNLOAD
let d=JSON.parse(localStorage.getItem('dlCount')||'0'); localStorage.setItem('dlCount', JSON.stringify((parseInt(d)||0)+1));
</script></body></html>
